name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Workflow liest nur Code und lädt Testberichte hoch – kein Schreibzugriff aufs Repository nötig.
# Actions sind auf Commits festgenagelt (ein verschobenes Tag kann keinen fremden Code einschleusen);
# Dependabot hält die Commits aktuell.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Domain-Tests
        run: ./gradlew :domain:test
      - name: Unit-Tests, Lint, Debug-Build
        run: ./gradlew check :app:assembleDebug
      # R8 entfernt nur im Release-Build Code – Fehler in Keep-Regeln fallen sonst erst beim Veröffentlichen auf
      - name: Release-Build (R8)
        run: ./gradlew :app:assembleRelease

  # Room-, Migrations- und End-to-End-Tests auf einem Emulator (Gradle Managed Device, siehe app/build.gradle.kts).
  # Schützt vor allem die Datenbank-Migrationen: ein Fehler dort bedeutet Datenverlust beim App-Update.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Instrumented-Tests (Managed Device)
        run: >
          ./gradlew ciDeviceDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
