name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Workflow liest nur Code und lädt Testberichte hoch – kein Schreibzugriff aufs Repository nötig.
# Actions sind auf Commits festgenagelt (ein verschobenes Tag kann keinen fremden Code einschleusen);
# Dependabot hält die Commits aktuell.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Domain-Tests
        run: ./gradlew :domain:test
      - name: Unit-Tests, Lint, Debug-Build
        run: ./gradlew check :app:assembleDebug
      # R8 entfernt nur im Release-Build Code – Fehler in Keep-Regeln fallen sonst erst beim Veröffentlichen auf
      - name: Release-Build (R8)
        run: ./gradlew :app:assembleRelease

  # Room-, Migrations- und End-to-End-Tests auf einem Emulator (Gradle Managed Device, siehe app/build.gradle.kts).
  # Schützt vor allem die Datenbank-Migrationen: ein Fehler dort bedeutet Datenverlust beim App-Update.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Instrumented-Tests (Managed Device)
        run: >
          ./gradlew ciDeviceDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore

  # Sync-Server: Tests, Docker-Image (ohne Android-SDK) und ein Smoke-Test des laufenden Containers.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Server- und Protokoll-Tests
        run: ./gradlew :sync-protocol:test :server:test
      - name: Docker-Image bauen
        run: docker build -f server/Dockerfile -t foody-server:ci .
      - name: Smoke-Test des Containers
        run: |
          docker run -d --name foody \
            -e FOODY_ADMIN_USER=admin -e FOODY_ADMIN_PASSWORD=ci-passwort-123 \
            -e FOODY_DB_PATH=/tmp/foody.db -p 8080:8080 foody-server:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/health && break
            if [ "$i" = 30 ]; then docker logs foody; exit 1; fi
            sleep 2
          done
          curl -fsS -H 'X-Foody-Protocol: 1' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-passwort-123","deviceName":"ci"}' \
            localhost:8080/api/v1/auth/login | grep -q token || { docker logs foody; exit 1; }
      - name: Compose-Datei prüfen
        run: docker compose -f server/docker-compose.yml --env-file server/.env.example config -q
