name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Workflow liest nur Code und lädt Testberichte hoch – kein Schreibzugriff aufs Repository nötig.
# Actions sind auf Commits festgenagelt (ein verschobenes Tag kann keinen fremden Code einschleusen);
# Dependabot hält die Commits aktuell.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Domain-Tests
        run: ./gradlew :domain:test
      # Unit-Tests einmal (nur Debug, siehe build-logic) und dabei die Referenzbilder vergleichen: ein eigener
      # verifyRoborazzi-Schritt ließe alle Robolectric-Tests ein zweites Mal laufen (E1)
      - name: Unit-Tests mit Bildvergleich, Lint, Debug-Build
        run: ./gradlew check :app:assembleDebug :katalog:assembleDebug -Proborazzi.test.verify=true
      # R8 entfernt nur im Release-Build Code – Fehler in Keep-Regeln fallen sonst erst beim Veröffentlichen auf
      - name: Release-Build (R8)
        run: ./gradlew :app:assembleRelease

  # Room- und Migrationstests auf einem Emulator (Gradle Managed Device, siehe android/core/data/build.gradle.kts).
  # Schützt vor allem die Datenbank-Migrationen: ein Fehler dort bedeutet Datenverlust beim App-Update.
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Instrumented-Tests (Managed Device)
        run: >
          ./gradlew ciDeviceDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # R8-Variante einmal starten und „Frei“ öffnen (E4): Ein grüner Release-Build fängt fehlende Keep-Regeln nicht ab
      # (Z1 stürzte erst auf dem Handy ab). benchmarkVorschau = „Foody Vorschau“ mit R8 wie im Release, Debug-Schlüssel.
      - name: Release-Kurztest (R8, Managed Device)
        run: >
          ./gradlew :baselineprofile:ciDeviceBenchmarkVorschauAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=de.foody.baselineprofile.ReleaseStartTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: |
            android/*/*/build/reports/androidTests/managedDevice/
            android/baselineprofile/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
      # Logcat je Test und JUnit-XML: der HTML-Bericht enthält nur den Stacktrace, zum Eingrenzen von Flakes fehlt sonst alles
      - name: Logcat der Instrumented-Tests hochladen
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-logcat
          path: |
            android/*/*/build/outputs/androidTest-results/managedDevice/
            android/baselineprofile/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: ignore

  # Sync-Server: Tests, Docker-Image (ohne Android-SDK) und ein Smoke-Test des laufenden Containers.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Server- und Protokoll-Tests
        run: ./gradlew :api-protocol:test :server-sync:test :server:installDist
      - name: Docker-Image bauen
        run: docker build -f server/Dockerfile -t foody-server:ci .
      - name: Smoke-Test des Containers
        run: |
          # Gehärtete Laufzeit wie in der Compose-Datei; DB-Pfad bleibt der Standard (/data/foody.db).
          docker run -d --name foody \
            -e FOODY_ADMIN_USER=admin -e FOODY_ADMIN_PASSWORD=ci-passwort-123 \
            --read-only --tmpfs /tmp:exec,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
            -v foody-ci-data:/data -v foody-ci-photos:/data/photos \
            -p 8080:8080 foody-server:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/health && break
            if [ "$i" = 30 ]; then docker logs foody; exit 1; fi
            sleep 2
          done
          # Der Docker-Healthcheck fragt mit curl im Container (D5)
          docker exec foody curl -fsS http://127.0.0.1:8080/health
          # Protokoll 3: Login liefert Token und Konto-ID.
          curl -fsS -H 'X-Foody-Protocol: 3' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-passwort-123","deviceName":"ci"}' \
            localhost:8080/api/v3/auth/login | grep -q '"kontoId"' || { docker logs foody; exit 1; }
          # Konto über foody-admin anlegen und mit dem einmal ausgegebenen Passwort anmelden.
          ausgabe=$(docker exec foody foody-admin konto-anlegen ci2) || { docker logs foody; exit 1; }
          echo "$ausgabe" | grep -q "Passwort:" || { echo "$ausgabe"; exit 1; }
          passwort=$(echo "$ausgabe" | sed -n 's/^.*Passwort: //p')
          curl -fsS -H 'X-Foody-Protocol: 3' -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci2\",\"password\":\"$passwort\",\"deviceName\":\"ci\"}" \
            localhost:8080/api/v3/auth/login | grep -q '"kontoId"' || { docker logs foody; exit 1; }
          # Den v1-Pfad gibt es seit dem Ende des Rückwegs nicht mehr (C4): 404 wie in ApiV3Test.alterPfadGibtEsNichtMehr.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Foody-Protocol: 2' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-passwort-123","deviceName":"ci"}' localhost:8080/api/v1/auth/login)
          [ "$status" = 404 ] || { echo "v1-Login: $status statt 404"; exit 1; }
      - name: Compose-Datei prüfen
        run: |
          cp server/.env.example server/.env
          docker compose -f server/docker-compose.yml --env-file server/.env.example config -q
