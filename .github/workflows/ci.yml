name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Domain-Tests
        run: ./gradlew :domain:test
      - name: Unit-Tests, Lint, Debug-Build
        run: ./gradlew check :app:assembleDebug
      # R8 entfernt nur im Release-Build Code – Fehler in Keep-Regeln fallen sonst erst beim Veröffentlichen auf
      - name: Release-Build (R8)
        run: ./gradlew :app:assembleRelease

  # Room-, Migrations- und End-to-End-Tests auf einem Emulator (Gradle Managed Device, siehe app/build.gradle.kts).
  # Schützt vor allem die Datenbank-Migrationen: ein Fehler dort bedeutet Datenverlust beim App-Update.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Instrumented-Tests (Managed Device)
        run: >
          ./gradlew ciDeviceDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
